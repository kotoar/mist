<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/deepdesign-7853aedb-e066-4394-9ef6-7e87711efda3/tokens.css">
<link rel="stylesheet" href="_ds/deepdesign-7853aedb-e066-4394-9ef6-7e87711efda3/styles.css">
<script src="_ds/deepdesign-7853aedb-e066-4394-9ef6-7e87711efda3/_ds_bundle.js"></script>
<style>
html,body{margin:0;padding:0}
</style>
</helmet>

<div class="{{ rootClass }}" style="min-height:100vh;background-attachment:fixed" data-screen-label="实验室">
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><symbol id="fogmark" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><circle cx="24" cy="19" r="12"></circle><circle cx="24" cy="19" r="3.5" fill="currentColor" stroke="none"></circle><path d="M7 32h22M15 38h26M10 44h19"></path></symbol></svg>

<div style="max-width:1360px;margin:0 auto;padding:0 32px">

  <!-- ===== 报头 ===== -->
  <header style="padding-top:24px">
    <div style="display:flex;align-items:center;justify-content:space-between;gap:16px;padding-bottom:14px;border-bottom:3px double var(--rule)">
      <a href="档案首页.dc.html" style="display:flex;align-items:center;gap:14px;color:inherit;text-decoration:none">
        <img src="uploads/icon.png" alt="迷雾档案" style="width:42px;height:42px;filter:{{ iconFilter }}">
        <h1 style="font-family:var(--serif);font-weight:900;font-size:clamp(24px,3.2vw,38px);letter-spacing:4px;margin:0;line-height:1.2">迷雾档案:实验室<small style="display:block;font-family:var(--mono);font-size:11px;font-weight:400;letter-spacing:2.5px;color:var(--mut);margin-top:4px">MISTCASE.APP</small></h1>
      </a>
      <button type="button" onClick="{{ toggleTheme }}" style="font-family:var(--mono);font-size:11px;color:var(--brass);background:var(--panel);border:1px solid var(--rule);padding:8px 10px;letter-spacing:1px;white-space:nowrap;cursor:pointer;transition:background .15s" style-hover="background:var(--hov)">[{{ themeLabel }}]</button>
    </div>
    <nav style="display:flex;flex-wrap:wrap;align-items:center;padding:11px 0;border-bottom:1px solid var(--rule)">
      <a href="档案首页.dc.html" style="font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;color:var(--brass);text-transform:uppercase;padding:3px 8px;white-space:nowrap;text-decoration:none;transition:background .15s" style-hover="background:var(--hov)">[主页]</a>
      <a href="档案库.dc.html" style="font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;color:var(--brass);text-transform:uppercase;padding:3px 8px;white-space:nowrap;text-decoration:none;transition:background .15s" style-hover="background:var(--hov)">[档案]</a>
      <a href="迷雾库.dc.html" style="font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;color:var(--brass);text-transform:uppercase;padding:3px 8px;white-space:nowrap;text-decoration:none;transition:background .15s" style-hover="background:var(--hov)">[迷雾]</a>
      <a href="解谜.dc.html" style="font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;color:var(--brass);text-transform:uppercase;padding:3px 8px;white-space:nowrap;text-decoration:none;transition:background .15s" style-hover="background:var(--hov)">[解谜]</a>
      <span style="flex:1"></span>
      <a href="实验室.dc.html" style="font-family:var(--mono);font-size:12.5px;letter-spacing:1.5px;color:var(--brass);text-transform:uppercase;padding:3px 8px;white-space:nowrap;text-decoration:none;background:var(--hov);transition:background .15s">[实验室]</a>
    </nav>
  </header>

  <!-- ===== 蝴蝶效应 ===== -->
  <section>
    <div style="display:flex;align-items:baseline;gap:14px;padding:30px 0 14px;border-bottom:1px solid var(--rule)">
      <h3 style="font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:3px;margin:0">蝴蝶效应</h3>
      <span style="font-family:var(--mono);font-size:10px;letter-spacing:1.5px;color:var(--brass);border:1px solid var(--brass);padding:2px 7px;text-transform:uppercase">Beta</span>
      <span style="flex:1"></span>
    </div>
    <p style="font-family:var(--serif);font-size:13.5px;color:var(--dim);line-height:1.95;max-width:66ch;margin:16px 0 22px;white-space:pre-line;border-left:2px solid var(--rule);padding-left:16px">失败并非不可避免,你的一个小改变可能会改变整个故事的走向。
在《蝴蝶效应》中,你可以选择故事中的一个片段进行改写,看看故事会如何发展下去。
你的目标是让原本没有发生的事件发生,或者让已经发生的事件不再发生。</p>
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));border:1px solid var(--rule)">
      <a href="#" style="display:block;padding:22px 24px;border-right:1px solid var(--rule);text-decoration:none;color:inherit;transition:background .15s" style-hover="background:var(--hov)">
        <h4 style="font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:1px;margin:0 0 9px">P01 广场上的枪声</h4>
        <p style="font-family:var(--serif);font-size:13px;color:var(--dim);line-height:1.85;margin:0">市长遭瞄准之际,狙击手却神秘倒下,枪声未响,真相暗涌</p>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:1px"><span style="color:var(--brass);white-space:nowrap">[进入]</span></div>
      </a>
      <a href="#" style="display:block;padding:22px 24px;text-decoration:none;color:inherit;transition:background .15s" style-hover="background:var(--hov)">
        <h4 style="font-family:var(--serif);font-weight:700;font-size:20px;letter-spacing:1px;margin:0 0 9px">P02 沉默的祝酒词</h4>
        <p style="font-family:var(--serif);font-size:13px;color:var(--dim);line-height:1.85;margin:0">毒酒未入口,侍者却被枪击倒地;教父大寿之夜的暗杀在爆响中逆转</p>
        <div style="display:flex;justify-content:flex-end;margin-top:14px;font-family:var(--mono);font-size:11px;letter-spacing:1px"><span style="color:var(--brass);white-space:nowrap">[进入]</span></div>
      </a>
    </div>
  </section>

  <!-- ===== 报尾 ===== -->
  <footer style="display:flex;align-items:center;gap:8px 22px;flex-wrap:wrap;font-family:var(--mono);font-size:11.5px;letter-spacing:.5px;color:var(--mut);padding:20px 0 56px;margin-top:46px;border-top:2px solid var(--rule)">
    <span>© 2025 MistCase by <a href="https://deepclue.app" target="_blank" rel="noopener noreferrer" style="color:var(--brass);text-decoration:none;white-space:nowrap;padding:1px 3px;transition:background .15s" style-hover="background:var(--hov)">[DeepClue ↗]</a></span>
    <span style="flex:1"></span>
  </footer>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1360},&quot;light&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;主题&quot;}}">
class Component extends DCLogic {
  state = { light: null };
  renderVals(){
    const light = this.state.light ?? (this.props.light ?? false);
    return {
      rootClass: light ? 'arch light' : 'arch',
      themeLabel: light ? '☀ 亮色' : '☾ 暗色',
      iconFilter: light ? 'none' : 'invert(1)',
      toggleTheme: () => this.setState({ light: !light }),
    };
  }
}
</script>
</body>
</html>
